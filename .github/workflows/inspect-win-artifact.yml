name: Inspect Windows artifact

# Downloads an existing windows-portable artifact, checks the zip layout and the
# executable's PE imports, then commits the report to the `ci-report` branch.
# Reason for the branch trick: the build machine cannot stream 68 MB artifacts or the
# redirected job logs, but it can read a few KB from raw.githubusercontent.com.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id that produced AdaptNote-windows-x64"
        required: true

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AdaptNote-windows-x64
          path: art
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Inspect package
        shell: pwsh
        run: |
          $report = New-Object System.Collections.Generic.List[string]
          function Say($line) { Write-Host $line; $report.Add([string]$line) }
          $failed = $false

          $zip = Get-ChildItem art -Recurse -Filter *.zip | Select-Object -First 1
          Say "artifact zip: $($zip.Name)  $([math]::Round($zip.Length/1MB,1)) MB"
          Expand-Archive $zip.FullName -DestinationPath pkg
          $root = Get-ChildItem pkg -Directory | Select-Object -First 1
          Say "package root: $($root.Name)"

          Say "--- top level ---"
          Get-ChildItem $root.FullName | Sort-Object Name | ForEach-Object {
            if ($_.PSIsContainer) { Say ("  {0}/" -f $_.Name) }
            else { Say ("  {0}  {1} KB" -f $_.Name, [math]::Round($_.Length/1KB)) }
          }

          Say "--- bin ---"
          Get-ChildItem (Join-Path $root.FullName "bin") -File | Sort-Object Name |
            ForEach-Object { Say ("  {0}  {1} KB" -f $_.Name, [math]::Round($_.Length/1KB)) }

          Say "--- plugins ---"
          foreach ($d in @("platforms","imageformats","tls","styles","iconengines","fonts","resources")) {
            $p = Join-Path $root.FullName $d
            if (Test-Path $p) {
              Get-ChildItem $p -File | Sort-Object Name |
                ForEach-Object { Say ("  {0}/{1}" -f $d, $_.Name) }
            } else { Say "  (no $d dir)" }
          }

          Say "--- launcher ---"
          $bats = Get-ChildItem $root.FullName -Filter *.bat
          if ($bats.Count -eq 0) { Say "  MISSING launcher .bat"; $failed = $true }
          foreach ($b in $bats) {
            Say "  $($b.Name):"
            Get-Content $b.FullName | ForEach-Object { Say "    $_" }
            if ((Get-Content $b.FullName -Raw) -notmatch 'XDG_DATA_HOME') {
              Say "  ERROR: launcher does not set XDG_DATA_HOME"; $failed = $true
            }
          }

          Say "--- samples ---"
          if (Test-Path (Join-Path $root.FullName "samples")) {
            Get-ChildItem (Join-Path $root.FullName "samples") -File |
              ForEach-Object { Say ("  {0}  {1} KB" -f $_.Name, [math]::Round($_.Length/1KB)) }
          } else { Say "  (no samples dir)" }

          Say ("TOTAL FILES: " + (Get-ChildItem $root.FullName -Recurse -File).Count)

          # ---------- PE imports ----------
          Say "--- PE imports ---"
          $exes = Get-ChildItem (Join-Path $root.FullName "bin") -Filter *.exe
          if ($exes.Count -eq 0) { Say "  ERROR: no exe in bin/"; $failed = $true }
          $bundled = @{}
          Get-ChildItem (Join-Path $root.FullName "bin") -File |
            ForEach-Object { $bundled[$_.Name.ToLower()] = $true }
          foreach ($exe in $exes) {
            Say "  $($exe.Name) imports:"
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
            $dlls = [regex]::Matches($text, '(?i)[A-Za-z0-9_\-\.]+\.dll') |
                    ForEach-Object { $_.Value.ToLower() } | Sort-Object -Unique
            foreach ($d in $dlls) {
              if ($bundled.ContainsKey($d)) { Say "    [bundled] $d" }
              elseif ($d -match '^(kernel32|kernelbase|user32|gdi32|gdiplus|advapi32|shell32|ole32|oleaut32|ws2_32|comdlg32|comctl32|dwmapi|uxtheme|shlwapi|version|imm32|winmm|netapi32|userenv|mpr|bcrypt|ntdll|crypt32|secur32|dnsapi|iphlpapi|wintrust|dbghelp|powrprof|setupapi|cfgmgr32|msvcrt|ucrtbase|opengl32|api-ms-win[a-z0-9\-]*)\.dll$') {
                Say "    [system]  $d"
              } else { Say "    [MISSING] $d"; $failed = $true }
            }
          }

          # ---------- required Qt pieces ----------
          Say "--- required files ---"
          $need = @("bin\Qt6Core.dll","bin\Qt6Gui.dll","bin\Qt6Widgets.dll","bin\Qt6Pdf.dll",
                    "bin\Qt6Network.dll","bin\Qt6Sql.dll","bin\Qt6Svg.dll","platforms\qwindows.dll")
          foreach ($n in $need) {
            $p = Join-Path $root.FullName $n
            if (Test-Path $p) { Say "  present $n" } else { Say "  MISSING $n"; $failed = $true }
          }

          Say ("RESULT: " + $(if ($failed) { "FAILED" } else { "PACKAGE CHECKS PASSED" }))

          New-Item -ItemType Directory -Force ci | Out-Null
          $report -join "`n" | Out-File ci/windows-report.txt -Encoding utf8
          if ($failed) { throw "package checks failed - see ci/windows-report.txt" }

      - name: Publish report to ci-report branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git checkout -B ci-report
          git add ci/windows-report.txt
          git commit -m "ci: windows package report for run ${{ inputs.run_id }}" | Out-Null
          git push -f origin ci-report
