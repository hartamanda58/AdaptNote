name: Inspect Windows artifact

# Downloads an existing windows-portable artifact, verifies the zip layout and the
# executable's real PE import table, then commits the report to the `ci-report` branch
# (and uploads it as an artifact). Running this inside CI is deliberate: the machine
# that drives these builds cannot read multi-MB responses, let alone a 68 MB zip.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id that produced AdaptNote-windows-x64"
        required: true

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AdaptNote-windows-x64
          path: art
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Inspect package
        shell: pwsh
        run: |
          $report = New-Object System.Collections.Generic.List[string]
          function Say($line) { Write-Host $line; $report.Add([string]$line) }
          $failed = $false

          $zip = Get-ChildItem art -Recurse -Filter *.zip | Select-Object -First 1
          Say "artifact zip: $($zip.Name)  $([math]::Round($zip.Length/1MB,1)) MB"
          Expand-Archive $zip.FullName -DestinationPath pkg
          $root = Get-ChildItem pkg -Directory | Select-Object -First 1
          Say "package root: $($root.Name)"

          Say "--- top level ---"
          Get-ChildItem $root.FullName | Sort-Object Name | ForEach-Object {
            if ($_.PSIsContainer) { Say ("  {0}/" -f $_.Name) }
            else { Say ("  {0}  {1} KB" -f $_.Name, [math]::Round($_.Length/1KB)) }
          }

          Say "--- bin ---"
          Get-ChildItem (Join-Path $root.FullName "bin") -File | Sort-Object Name |
            ForEach-Object { Say ("  {0}  {1} KB" -f $_.Name, [math]::Round($_.Length/1KB)) }

          Say "--- directories anywhere in the package ---"
          Get-ChildItem $root.FullName -Recurse -Directory | ForEach-Object {
            $rel = $_.FullName.Substring($root.FullName.Length + 1)
            Say ("  {0}/  ({1} file(s))" -f $rel, (Get-ChildItem $_.FullName -File).Count)
          }

          Say "--- plugins ---"
          foreach ($d in @("platforms","imageformats","tls","styles","iconengines","fonts","resources","sqldrivers")) {
            $found = @()
            foreach ($base in @($root.FullName, (Join-Path $root.FullName "bin"))) {
              $p = Join-Path $base $d
              if (Test-Path $p) { $found += (Get-ChildItem $p -File) }
            }
            if ($found.Count -gt 0) {
              $found | Sort-Object Name | ForEach-Object { Say ("  {0}/{1}" -f $d, $_.Name) }
            } else { Say "  (no $d dir)" }
          }

          Say "--- launcher ---"
          $bats = Get-ChildItem $root.FullName -Filter *.bat
          if ($bats.Count -eq 0) { Say "  MISSING launcher .bat"; $failed = $true }
          foreach ($b in $bats) {
            Say "  $($b.Name):"
            Get-Content $b.FullName | ForEach-Object { Say "    $_" }
            if ((Get-Content $b.FullName -Raw) -notmatch 'XDG_DATA_HOME') {
              Say "  ERROR: launcher does not set XDG_DATA_HOME"; $failed = $true
            }
          }

          Say "--- samples ---"
          $sampleDir = Join-Path $root.FullName "samples"
          $sampleCount = 0
          if (Test-Path $sampleDir) {
            Get-ChildItem $sampleDir -File |
              ForEach-Object { Say ("  {0}  {1} KB" -f $_.Name, [math]::Round($_.Length/1KB)) }
            $sampleCount = @(Get-ChildItem $sampleDir -File).Count
          }
          if ($sampleCount -eq 0) { Say "  ERROR: samples/ is empty"; $failed = $true }
          Say ("TOTAL FILES: " + (Get-ChildItem $root.FullName -Recurse -File).Count)

          # ---------- real PE imports (dumpbin, not a string scan) ----------
          Say "--- PE imports (dumpbin /dependents) ---"
          $bundled = @{}
          Get-ChildItem (Join-Path $root.FullName "bin") -File |
            ForEach-Object { $bundled[$_.Name.ToLower()] = $true }
          $exes = @(Get-ChildItem (Join-Path $root.FullName "bin") -Filter *.exe |
                  Where-Object { $_.Name -match "adaptnote" })
          if (@($exes).Count -eq 0) { Say "  ERROR: no adaptnote.exe in bin/"; $failed = $true }
          foreach ($exe in $exes) {
            Say "  $($exe.Name):"
            $deps = & dumpbin /nologo /dependents $exe.FullName
            $dlls = $deps | Select-String -Pattern '^\s+([A-Za-z0-9_\-.]+\.dll)\s*$' -AllMatches |
                    ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value.ToLower() }
            foreach ($d in ($dlls | Sort-Object -Unique)) {
              if ($bundled.ContainsKey($d)) { Say "    [bundled] $d" }
              elseif ($d -match '^(kernel32|kernelbase|user32|gdi32|gdiplus|advapi32|shell32|ole32|oleaut32|ws2_32|comdlg32|comctl32|dwmapi|uxtheme|shlwapi|version|imm32|winmm|netapi32|userenv|mpr|bcrypt|ntdll|crypt32|secur32|dnsapi|iphlpapi|wintrust|dbghelp|powrprof|setupapi|cfgmgr32|msvcrt|ucrtbase|opengl32|d3d11|dxgi|api-ms-win[a-z0-9\-]*)\.dll$') {
                Say "    [system]  $d"
              } else { Say "    [MISSING] $d"; $failed = $true }
            }
          }

          # ---------- required runtime pieces ----------
          Say "--- required files ---"
          foreach ($n in @("bin\adaptnote.exe","bin\Qt6Core.dll","bin\Qt6Gui.dll",
                           "bin\Qt6Widgets.dll","bin\Qt6Network.dll","bin\Qt6Sql.dll",
                           "bin\Qt6Svg.dll","bin\platforms\qwindows.dll",
                           "bin\sqldrivers\qsqlite.dll")) {
            $p = Join-Path $root.FullName $n
            if (Test-Path $p) { Say "  present $n" } else { Say "  MISSING $n"; $failed = $true }
          }

          Say ("RESULT: " + $(if ($failed) { "FAILED" } else { "PACKAGE CHECKS PASSED" }))
          New-Item -ItemType Directory -Force ci | Out-Null
          $report -join "`n" | Out-File ci/windows-report.txt -Encoding utf8
          if ($failed) { throw "package checks failed - see ci/windows-report.txt" }

      - name: Runtime smoke test (PDF + EPUB + portable data)
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Get-ChildItem pkg -Directory | Select-Object -First 1
          $exe = Join-Path $root.FullName "bin\adaptnote.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "adaptnote-smoke"
          if (Test-Path $smoke) { Remove-Item $smoke -Recurse -Force }
          New-Item -ItemType Directory -Force $smoke | Out-Null
          # Exercise the platform shipped in the package; do not require qoffscreen.dll.
          $env:QT_QPA_PLATFORM = "windows"
          $env:ADAPT_HEADLESS = "1"
          $env:ADAPT_DATA_DIR = Join-Path $smoke "data"
          function Say($line) { Write-Host $line }

          $smokeLog = Join-Path $smoke "logs"
          New-Item -ItemType Directory -Force $smokeLog | Out-Null
          function RunSmoke([string]$label, [string[]]$CliArgs) {
            # $args is a PowerShell automatic variable: never use it as a parameter.
            if ($CliArgs.Count -eq 0) { throw "empty CLI arguments for $label" }
            Say "smoke ${label}: $($CliArgs | ConvertTo-Json -Compress)"
            $info = [System.Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $exe
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            # ArgumentList preserves spaces and Unicode without manual command-line quoting.
            foreach ($item in $CliArgs) { $info.ArgumentList.Add($item) }
            if ($info.ArgumentList.Count -ne $CliArgs.Count) { throw "argument count mismatch" }
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $info
            if (!$p.Start()) { throw "could not start $label" }
            $stdout = $p.StandardOutput.ReadToEndAsync()
            $stderr = $p.StandardError.ReadToEndAsync()
            $finished = $p.WaitForExit(120000)
            if (!$finished) { $p.Kill($true); $p.WaitForExit() }
            $outText = $stdout.GetAwaiter().GetResult()
            $errText = $stderr.GetAwaiter().GetResult()
            $outText | Set-Content (Join-Path $smokeLog "${label}.out.txt")
            $errText | Set-Content (Join-Path $smokeLog "${label}.err.txt")
            Say "  OUT $outText"
            Say "  ERR $errText"
            if (!$finished) { throw "smoke $label timed out" }
            Say "  exit=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "smoke $label failed with exit $($p.ExitCode)" }
          }

          $pdf = Join-Path $root.FullName "samples\test.pdf"
          $epub = Join-Path $root.FullName "samples\test.epub"
          $exports = Join-Path $smoke "exports"
          RunSmoke -label "pdf-export" -CliArgs @("--doc", $pdf, "--demo", "--export-dir", $exports)
          foreach ($ext in @("md","html","opml","xmind","apkg")) {
            if (!(Test-Path (Join-Path $exports "notes.$ext"))) {
              throw "smoke pdf-export missing notes.$ext"
            }
          }
          RunSmoke -label "epub-export" -CliArgs @("--doc", $epub, "--export-dir", (Join-Path $smoke "epub-exports"))
          foreach ($kind in @("pdf", "epub")) {
            $doc = Join-Path $root.FullName "samples\test.$kind"
            $shot = Join-Path $smoke "$kind.png"
            RunSmoke -label "$kind-screenshot" -CliArgs @("--doc", $doc, "--screenshot", $shot)
            if (!(Test-Path $shot) -or (Get-Item $shot).Length -eq 0) { throw "missing $kind screenshot" }
          }

          # High-DPI acceptance: the *bitmap* must grow with the scale factor. Comparing
          # window screenshots is unreliable on a runner whose screen clamps the window, so
          # ask the app to print the rendered page size instead.
          function ProbeSize([string]$label, [string]$scaleFactor) {
            if ($scaleFactor) { $env:QT_SCALE_FACTOR = $scaleFactor } else { Remove-Item Env:\QT_SCALE_FACTOR -ErrorAction SilentlyContinue }
            $out = Join-Path $smokeLog "$label.out.txt"
            $err = Join-Path $smokeLog "$label.err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList @("--doc", $pdf, "--render-probe") -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "probe $label timed out" }
            $text = ((Get-Content $out -ErrorAction SilentlyContinue) + (Get-Content $err -ErrorAction SilentlyContinue)) -join "`n"
            Say "probe ${label}: $($text.Trim())"
            if ($p.ExitCode -ne 0) { throw "probe $label failed ($($p.ExitCode)): $text" }
            $m = [regex]::Match($text, 'bitmap=(\d+)x(\d+)')
            if (!$m.Success) { throw "probe $label printed no bitmap size" }
            return [int]$m.Groups[1].Value
          }
          $w1 = ProbeSize "dpr1" ""
          $w2 = ProbeSize "dpr2" "2"
          Remove-Item Env:\QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          $ratio = [math]::Round($w2 / [double]$w1, 2)
          Say "dpi: 1x=$w1 px, 2x=$w2 px, ratio=$ratio"
          if ($ratio -lt 1.8) { throw "render bitmap did not scale with dpi (ratio $ratio)" }
          if (!(Test-Path (Join-Path $smoke "data\library.db"))) { throw "smoke did not keep data in ADAPT_DATA_DIR" }

          Add-Content ci/windows-report.txt "--- runtime smoke ---"
          Add-Content ci/windows-report.txt "PDF CLI export: PASS (md/html/opml/xmind/apkg)"
          Add-Content ci/windows-report.txt "EPUB CLI open/export: PASS"
          Add-Content ci/windows-report.txt "Portable data dir: PASS"
          Add-Content ci/windows-report.txt "PDF/EPUB window screenshots: PASS (qwindows)"
          Add-Content ci/windows-report.txt ("High-DPI render ratio at 200% scaling: " + $ratio)

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: ${{ runner.temp }}/adaptnote-smoke
          if-no-files-found: warn

      - name: Publish report
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path ci/windows-report.txt)) {
            "inspection did not produce a report" | Out-File ci/windows-report.txt -Encoding utf8
          }
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git checkout -B ci-report
          git add -f ci/windows-report.txt
          git commit --allow-empty -m "ci: windows package report for run ${{ inputs.run_id }}"
          git push -f origin ci-report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: ci/windows-report.txt
          if-no-files-found: warn
