<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AdaptNote 工作区原型 v2</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e7ee; --text:#1d2129; --muted:#5b6472;
    --accent:#2f6bd8; --accent-soft:#e9f0fd; --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}
  .top{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;letter-spacing:.02em;color:#12408f}
  .tabs{display:flex;gap:3px;margin-left:6px;overflow:hidden;max-width:52vw}
  .tab{padding:4px 9px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:12.5px}
  .tab.on{background:var(--accent-soft);border-color:#cbdffb;color:#17418f;font-weight:600}
  .spacer{flex:1}
  .modes{display:flex;gap:2px;padding:2px;background:#eceef2;border-radius:8px}
  .modes button{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px}
  .modes button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:var(--shadow)}
  .body{display:flex;height:calc(100vh - 44px)}
  .pane{display:flex;flex-direction:column;min-width:0}
  .pane.mind{background:#fafbfd;border-right:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:4px;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px}
  .bar .t{font-weight:600;color:var(--text);font-size:13px}
  .tool{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--muted);font-size:12px}
  .tool:hover{background:#eef1f6;color:var(--text)}
  .tool.on{background:var(--accent-soft);color:#17418f}
  .split{width:5px;cursor:col-resize;background:transparent}
  .split:hover{background:#d8e0ec}

  .canvas{position:relative;flex:1;overflow:auto;padding:0}
  svg.edges{position:absolute;left:0;top:0;pointer-events:none}
  .nodes{position:relative;width:100%;height:100%}
  .card{position:absolute;width:206px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 9px;cursor:default}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
  .card .h{display:flex;align-items:baseline;gap:5px;font-weight:600;font-size:12.5px;line-height:1.35;margin-bottom:3px}
  .badge{flex:none;font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px;line-height:15px}
  .ab{font-size:11.5px;color:var(--muted);background:#fafbfd;border-left:2px solid #d7e1f2;padding:3px 6px;margin:4px 0;border-radius:0 4px 4px 0;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .cm{font-size:12px;color:var(--text)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:5px;padding-top:4px;border-top:1px dashed var(--line);font-size:10.5px;color:#98a2b3}
  .go{border:1px solid #cbdffb;background:#fff;border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--accent);cursor:pointer;white-space:nowrap}
  .go:hover{background:var(--accent-soft)}
  .topic{background:linear-gradient(180deg,#f2f7ff,#eaf1fd);border-color:#cbdffb}
  .topic .h{font-size:13px;color:#12408f}
  .sub{font-size:11px;color:var(--muted);margin-top:2px}

  .reader{flex:1;overflow:auto;background:#2a2d33;padding:14px;display:flex;justify-content:center}
  .pagewrap{background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.4);position:relative;align-self:flex-start}
  .pagewrap img{display:block;width:100%;height:auto}
  .hl{position:absolute;background:rgba(255,206,0,.45);border-radius:2px;mix-blend-mode:multiply}
  .ghost{position:absolute;outline:2px solid rgba(47,107,216,.95);background:rgba(47,107,216,.10);border-radius:2px;display:none}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2129;color:#fff;padding:6px 13px;border-radius:8px;font-size:12px;opacity:0;transition:.18s;pointer-events:none}
  .toast.on{opacity:.95}
  .legend{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 11px;font-size:11.5px;color:var(--muted);max-width:270px}
  .legend b{color:var(--text)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">AdaptNote</div>
  <div class="tabs">
    <button class="tab on">Trace-based JIT（article.pdf）</button>
    <button class="tab">demo.epub</button>
    <button class="tab">＋ 添加资料</button>
  </div>
  <div class="spacer"></div>
  <div class="modes">
    <button data-mode="read">专注阅读</button>
    <button data-mode="both" class="on">阅读整理</button>
    <button data-mode="mind">专注脑图</button>
  </div>
</div>

<div class="body">
  <div class="pane mind" id="mindPane" style="width:47%">
    <div class="bar">
      <span class="t">编译器论文</span><span style="color:#98a2b3">· 3 条摘录</span>
      <span class="spacer"></span>
      <button class="tool on">＋ 节点</button>
      <button class="tool">折叠</button>
      <button class="tool">适配全图</button>
      <button class="tool">导出</button>
    </div>
    <div class="canvas" id="canvas">
      <svg class="edges" id="edges"></svg>
      <div class="nodes" id="nodes"></div>
    </div>
    <div class="bar" style="border-top:1px solid var(--line);border-bottom:0">
      <span>单击选中 · 双击改名 · Tab 子节点 · Enter 同级</span>
      <span class="spacer"></span><span id="zoomlbl">100%</span>
    </div>
  </div>

  <div class="split" id="split"></div>

  <div class="pane" id="readPane">
    <div class="bar">
      <button class="tool on">选择</button>
      <button class="tool">高亮</button>
      <button class="tool">下划线</button>
      <button class="tool">手写</button>
      <span class="spacer"></span>
      <span style="color:#98a2b3">第 1 / 3 页</span>
      <button class="tool">适宽</button><button class="tool">100%</button><button class="tool">目录</button>
    </div>
    <div class="reader" id="reader">
      <div class="pagewrap" id="pagewrap" style="width:min(700px,100%)">

<script>
const NODES = [
  {id:'root', title:'编译器论文', sub:'3 条摘录 · 2 分支', topic:true},
  {id:'a',    title:'Abstract', badge:'原文 p.1',
   ab:'Dynamic languages such as JavaScript are more difficult to compile than statically typed ones.',
   cm:'界定了问题：类型无法静态得知。', go:21.2},
  {id:'b',    title:'编译器架构', sub:'三条技术路线'},
  {id:'c',    title:'Trace-based JIT', badge:'原文 p.1',
   ab:'Our system uses a mixed-mode execution approach: start running JavaScript in a fast-starting bytecode interpreter.',
   cm:'与 method JIT 的差别在于以 trace 为粒度。', go:43.5},
  {id:'d',    title:'类型特化', badge:'原文 p.1',
   ab:'Each compiled trace covers one path through the program with one mapping of values to types.',
   cm:'特化命中率决定收益上限。', go:43.5},
  {id:'e',    title:'待读：评估章节', sub:'第 5 节性能对比'}
];
const EDGES = [['root','a'],['root','b'],['root','e'],['b','c'],['b','d']];

const COLW = 206, GAPX = 30, GAPY = 13, PAD = 16;
const nodesEl = document.getElementById('nodes');
const edgesEl = document.getElementById('edges');
const toast = document.getElementById('toast');
const reader = document.getElementById('reader');
const ghost = document.getElementById('ghost');

function say(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(say._t); say._t=setTimeout(()=>toast.classList.remove('on'),1500); }

const kids = {}; NODES.forEach(n=>kids[n.id]=[]);
EDGES.forEach(([a,b])=>kids[a].push(b));
const depth = {}; (function walk(id,d){ depth[id]=d; (kids[id]||[]).forEach(k=>walk(k,d+1)); })('root',0);

function build(){
  nodesEl.innerHTML='';
  NODES.forEach(n=>{
    const el=document.createElement('div');
    el.className='card'+(n.topic?' topic':'');
    el.dataset.id=n.id;
    el.innerHTML = `<div class="h">${n.title}${n.badge?`<span class="badge">${n.badge}</span>`:''}</div>`
      + (n.sub?`<div class="sub">${n.sub}</div>`:'')
      + (n.ab?`<div class="ab">${n.ab}</div>`:'')
      + (n.cm?`<div class="cm">${n.cm}</div>`:'')
      + (n.go!=null?`<div class="foot"><span>来源可回溯</span><button class="go">定位原文</button></div>`:'');
    el.onclick=e=>{ if(e.target.classList.contains('go')) return;
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); };
    nodesEl.appendChild(el);
  });
  nodesEl.querySelectorAll('[data-id]').forEach(el=>{
    const n=NODES.find(x=>x.id===el.dataset.id);
    const b=el.querySelector('.go');
    if(b) b.onclick=()=>{
      const y=reader.scrollTop+(n.go/100)*document.getElementById('pagewrap').clientHeight-reader.clientHeight*0.3;
      reader.scrollTo({top:Math.max(0,y),behavior:'smooth'});
      ghost.style.top=n.go+'%'; ghost.style.display='block';
      setTimeout(()=>ghost.style.display='none',2800);
      say('已定位到原文并高亮');
    };
  });
  layout();
}

function layout(){
  const els={}; nodesEl.querySelectorAll('[data-id]').forEach(el=>els[el.dataset.id]=el);
  const h={}; Object.keys(els).forEach(id=>h[id]=els[id].offsetHeight);

  const byDepth={};
  Object.keys(depth).forEach(id=>{ (byDepth[depth[id]] = byDepth[depth[id]]||[]).push(id); });
  const maxD=Math.max(...Object.values(depth));
  const y={};

  // bottom-up: stack the deepest level, then centre each parent on its children
  for(let d=maxD; d>=0; d--){
    let cursor=PAD;
    byDepth[d].forEach(id=>{
      const ks=kids[id]||[];
      let want=null;
      if(ks.length){
        const top=Math.min(...ks.map(k=>y[k]));
        const bot=Math.max(...ks.map(k=>y[k]+h[k]));
        want=(top+bot)/2-h[id]/2;
      }
      y[id]= want==null ? cursor : Math.max(cursor, want);
      cursor=y[id]+h[id]+GAPY;
    });
  }

  const totalH=Math.max(...Object.keys(y).map(id=>y[id]+h[id]))+PAD;
  const totalW=PAD*2+COLW*3+GAPX*2;
  nodesEl.style.height=totalH+'px';

  Object.keys(els).forEach(id=>{
    els[id].style.left=(PAD+depth[id]*(COLW+GAPX))+'px';
    els[id].style.top=y[id]+'px';
  });
  drawEdges(els,y,h,totalW,totalH);
}

function drawEdges(els,y,h,W,H){
  let html='';
  EDGES.forEach(([a,b])=>{
    const x1=PAD+depth[a]*(COLW+GAPX)+COLW, y1=y[a]+h[a]/2;
    const x2=PAD+depth[b]*(COLW+GAPX),      y2=y[b]+h[b]/2;
    const mx=(x1+x2)/2;
    html+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#c6d0de" stroke-width="1.6"/>`;
    html+=`<circle cx="${x2}" cy="${y2}" r="2.6" fill="#a7b6ca"/>`;
  });
  edgesEl.innerHTML=html;
  edgesEl.setAttribute('width',W); edgesEl.setAttribute('height',H);
  edgesEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
}

// modes
document.querySelectorAll('.modes button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const mind=document.getElementById('mindPane'), sp=document.getElementById('split'), rp=document.getElementById('readPane');
    const m=b.dataset.mode;
    if(m==='read'){ mind.style.display='none'; sp.style.display='none'; rp.style.display='flex'; }
    else if(m==='mind'){ mind.style.display='flex'; mind.style.width='100%'; sp.style.display='none'; rp.style.display='none'; }
    else { mind.style.display='flex'; mind.style.width='47%'; sp.style.display='block'; rp.style.display='flex'; }
    requestAnimationFrame(layout);
  };
});

// splitter
const split=document.getElementById('split'); let drag=false;
split.onmousedown=e=>{drag=true;e.preventDefault();document.body.style.cursor='col-resize';};
window.onmousemove=e=>{ if(!drag)return;
  document.getElementById('mindPane').style.width=Math.max(300,Math.min(e.clientX,innerWidth-340))+'px'; };
window.onmouseup=()=>{drag=false;document.body.style.cursor='';};
window.onresize=()=>layout();

build();
window.addEventListener('load',()=>layout());
